name: frontend_flutter_pos
description: A Flutter POS application for retail/restaurant operations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.3.3
  connectivity_plus: ^5.0.2

  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3

  # UI components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  collection: ^1.18.0
  equatable: ^2.0.5

  # Printing (driver-connected / large-format printers)
  pdf: ^3.10.4
  printing: ^5.12.0

  # Printing (direct thermal printers: Bluetooth / USB / Network)
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  flutter_pos_printer_platform_image_3: ^1.2.4
  image: ^4.3.0

  # Scanner
  web_socket_channel: ^3.0.3

  # Permissions
  permission_handler: ^11.2.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Regular.ttf
        - asset: assets/fonts/NotoSansKhmer-Bold.ttf
          weight: 700