spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
      resolve-lazily: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kaknnea_lowerpos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mypassword}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  forward-headers-strategy: framework
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB
  address: 0.0.0.0

app:
  jwt:
    issuer: kaknnea-pos
    secret: ${JWT_SECRET:ChangeThisSecretInProd_32bytesminimum}
    access-token-minutes: 720
  mail:
    from: ${MAIL_FROM:noreply@kaknnea.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:3000,http://127.0.0.1:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
